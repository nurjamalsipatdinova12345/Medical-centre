{% load static %}
    <!-- Featured Services Section -->
    <section id="services" class="featured-services section">

      <!-- Section Title -->
      <div class="container section-title" data-aos="fade-up">
        <h2>Tiykargi Servislarimiz</h2>
        <p>Joqari qánigeler hám zamanagóy texnologiyalar járdeminde siz hám shańaraǵıńız salamatlıǵı haqqında ǵamxorlıq etemiz.</p>
      </div><!-- End Section Title -->

      <div class="container" data-aos="fade-up" data-aos-delay="100">

        <div class="row gy-4">
          {% for i in services %}
          <div class="col-lg-4 col-md-6" data-aos="fade-up" data-aos-delay="200">
            <div class="service-card">
              <div class="service-icon">
                <i class="{{ i.icon }}"></i>

              </div>
              <div class="service-image">
                <img src="{{ i.image.url }}" alt="Service" class="img-fluid" loading="lazy">
              </div>
              <div class="service-content">
                <h3>{{i.title}}</h3>
                <p>{{ i.description }}</p>
              </div>
            </div>
          </div><!-- End Service Card -->
          {% endfor %}
        </div>
      </div>
    </section><!-- /Featured Services Section -->
