{% load static %}

<section id="appointment" class="appointment section">
  <div class="container">
    <div class="row justify-content-center">

      <div class="col-lg-10" data-aos="fade-up" data-aos-delay="200">
        <div class="appointment-form-wrapper p-4 shadow-sm border rounded bg-white">

          <div class="text-center mb-4">
            <h2 class="fw-bold">Qabılǵa jazılıw</h2>
            <p class="text-muted">Magliwmatlarinizdi qaldirin, biz siz benen baylanisamiz.</p>
          </div>

          <form action="{% url 'home' %}" method="post" class="appointment-form">
            {% csrf_token %}
            <input type="hidden" name="form_type" value="appointment">

            <div class="row gy-3">
              {% for field in appointment_form %}
                <div class="{% if field.name == 'message' %}col-12{% else %}col-md-6{% endif %}">
                  {{ field }}
                  {% if field.errors %}
                    <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                  {% endif %}
                </div>
              {% endfor %}

              <div class="col-12 text-center mt-4">
                <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm">
                  <i class="bi bi-calendar-plus me-2"></i>Book Appointment
                </button>
              </div>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>
</section>
